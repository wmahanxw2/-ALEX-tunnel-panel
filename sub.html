.ov{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:rgba(3,4,10,.7);opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s}
.ov.on{opacity:1;visibility:visible}
.sheet{width:100%;max-width:460px;margin:0 10px max(10px,env(safe-area-inset-bottom));border-radius:28px;padding:18px;background:#10132a;border:1px solid var(--line2);transform:translate3d(0,40px,0);transition:transform .45s var(--spring);text-align:center}
.ov.on .sheet{transform:none}
.sheet h3{margin:0 0 12px;font-size:14px;unicode-bidi:plaintext;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet .qr{width:250px;margin:0 auto 14px}
.toast{position:fixed;left:50%;top:max(16px,env(safe-area-inset-top));z-index:60;transform:translate3d(-50%,-160%,0);display:flex;align-items:center;gap:9px;padding:11px 16px 11px 12px;border-radius:16px;background:rgba(16,19,36,.96);border:1px solid var(--line2);font-size:13px;font-weight:800;box-shadow:0 20px 40px -10px rgba(0,0,0,.7);transition:transform .5s var(--spring);pointer-events:none;max-width:90vw}
.toast.on{transform:translate3d(-50%,0,0)}
.toast .o{width:24px;height:24px;flex:none;border-radius:50%;display:grid;place-items:center;background:rgba(46,229,157,.18);color:var(--ok)}
.toast.err .o{background:rgba(255,95,109,.18);color:var(--bad)}
.spark{position:fixed;left:0;top:0;width:6px;height:6px;border-radius:50%;pointer-events:none;z-index:70;animation:sk .7s ease-out forwards}
@keyframes sk{to{transform:translate3d(var(--dx),var(--dy),0) scale(0);opacity:0}}
@media (hover:hover){.btn:hover,.app:hover{filter:brightness(1.12)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.js .rv{opacity:1;transform:none}.splash{display:none}}
</style>
<script>document.documentElement.className+=" js"</script>
